<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="thikana-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#thikana-grad)" />
    <!-- Roof + T Hybrid Shape -->
    <path d="M 60 26 L 86 48 L 78 48 L 78 54 L 60 38 L 42 54 L 42 48 Z" fill="#ffffff" opacity="0.95" />
    <!-- Main T-Bar (Roof Top) -->
    <path d="M 32 46 C 32 42, 35 40, 40 40 L 80 40 C 85 40, 88 42, 88 46 L 88 48 C 88 52, 85 54, 80 54 L 40 54 C 35 54, 32 52, 32 48 Z" fill="#ffffff" />
    <!-- T Stem + House Body -->
    <path d="M 52 54 L 68 54 L 68 84 C 68 88, 65 91, 60 91 C 55 91, 52 88, 52 84 Z" fill="#ffffff" />
    <!-- Location Pin Inner Dot Accent -->
    <circle cx="60" cy="68" r="5" fill="url(#accent-glow)" />
  </g>

  <!-- Typography: Thikana -->
  <text x="135" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5" fill="#0f172a">
    Thikana
  </text>
  <circle cx="438" cy="40" r="6" fill="url(#accent-glow)" />
</svg>
